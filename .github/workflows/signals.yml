name: Crypto Signal Agent

on:
  schedule:
    # Har 15 minute. GitHub kabhi 2-10 min delay kar sakta hai.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-signal-agent
  cancel-in-progress: false

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EQUITY_USDT: ${{ vars.EQUITY_USDT }}
          RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          MAX_SIGNALS_PER_DAY: ${{ vars.MAX_SIGNALS_PER_DAY }}
          MAX_NEW_PER_RUN: ${{ vars.MAX_NEW_PER_RUN }}
          MAX_PER_SIDE_PER_RUN: ${{ vars.MAX_PER_SIDE_PER_RUN }}
          COOLDOWN_HOURS: ${{ vars.COOLDOWN_HOURS }}
          BTC_STRICT: ${{ vars.BTC_STRICT }}
        run: python -m agent.main

      - name: Commit signal journal
        run: |
          if [ ! -f data/journal.json ] && [ ! -f data/trade_journal.json ]; then
            echo "No journal files yet, skipping commit"
            exit 0
          fi
          git config user.name "signal-agent"
          git config user.email "actions@users.noreply.github.com"
          for f in data/journal.json data/trade_journal.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Journal unchanged"
          else
            git commit -m "chore: update signal journal [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push || echo "Push failed - next run retry karega"
          fi
